<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1f" />
  <title>Egg Chase</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/effects.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu" class="overlay">
    <div class="card">
      <h1>EGG<br>CHASE</h1>
      <p class="sub">ডিম এড়াও, কয়েন কুড়াও, ঢাল পাও!</p>
      <label class="label" for="name">তোমার নাম</label>
      <input id="name" type="text" maxlength="12" placeholder="Enter your name" autocomplete="off" />
      <button id="start" class="btn">শুরু করো</button>
      <p class="help">
        ডেস্কটপ: তীর বা W A S D দিয়ে যেদিকে খুশি যাও · P দিয়ে পজ<br>
        মোবাইল: স্ক্রিনের যেখানে চাপবে বা টানবে রানার সেদিকে যাবে<br>
        🪙 কয়েন = +5 · 🛡 ঢাল = একবার ডিম আটকায় · খুব কাছ দিয়ে ডিম গেলে বোনাস
      </p>
    </div>
  </div>

  <div id="hud" class="hud hidden">
    <div class="hud-left">
      <div class="pill">স্কোর <span id="dist">0</span></div>
      <div class="pill">🪙 <span id="coins">0</span></div>
    </div>
    <button id="pause" class="pill pause-btn" aria-label="পজ">❚❚</button>
    <div class="hud-right">
      <div class="pill">🛡 <span id="shields">0</span></div>
      <div class="pill">Best <span id="best">0</span></div>
    </div>
  </div>

  <div id="pauseScreen" class="overlay hidden">
    <div class="card">
      <h2>পজ</h2>
      <button id="resume" class="btn">চালিয়ে যাও</button>
      <button id="restartPause" class="btn ghost">আবার শুরু</button>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="card">
      <h2>Game Over</h2>
      <p id="overMsg" class="sub"></p>
      <p class="score">স্কোর: <span id="overScore">0</span></p>
      <p class="sub">সেরা: <span id="overBest">0</span></p>
      <button id="restart" class="btn">আবার খেলো</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/features.js"></script>
  <script src="js/slowmo.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
